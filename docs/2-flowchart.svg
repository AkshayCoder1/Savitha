<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="960" viewBox="0 0 1360 960">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1360" height="960" fill="#ffffff"/>
<text x="40" y="48" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:28px;font-weight:700" fill="#111827">Makkal Kural - Complaint Flow</text>
<text x="40" y="76" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px" fill="#6b7280">From a spoken complaint to escalation</text>
<rect x="45.0" y="105.0" width="250" height="90" rx="12" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/><text x="170" y="146" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Citizen speaks or types</text><text x="170" y="164" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">+ photo + map pin</text><rect x="385.0" y="105.0" width="250" height="90" rx="12" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/><text x="510" y="146" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Browser speech-to-text</text><text x="510" y="164" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">(Hindi / Tamil / English)</text><rect x="725.0" y="105.0" width="250" height="90" rx="12" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/><text x="850" y="146" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">POST /complaints</text><text x="850" y="164" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">to FastAPI</text><rect x="1065.0" y="105.0" width="250" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1190" y="137" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Claude extracts type,</text><text x="1190" y="155" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">urgency, department,</text><text x="1190" y="173" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">English draft</text><line x1="295" y1="150" x2="385" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><line x1="635" y1="150" x2="725" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><line x1="975" y1="150" x2="1065" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><line x1="1190" y1="195" x2="1190" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><polygon points="1190,320.0 1315.0,380 1190,440.0 1065.0,380" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/><text x="1190" y="376" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;" fill="#111827">Same type within</text><text x="1190" y="394" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;" fill="#111827">50 m already?</text><rect x="725.0" y="335.0" width="250" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="850" y="376" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Merge into cluster</text><text x="850" y="394" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">count + 1</text><line x1="1065" y1="380" x2="975" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="1014.0" y="370.0" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;font-weight:700" fill="#b45309">YES</text><rect x="1065.0" y="555.0" width="250" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1190" y="605" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Create new complaint</text><line x1="1190" y1="440" x2="1190" y2="555" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="1200.0" y="497.5" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;font-weight:700" fill="#b45309">NO</text><rect x="725.0" y="555.0" width="250" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="850" y="596" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Repeat-failure check</text><text x="850" y="614" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">(past &#x27;resolved&#x27; here?)</text><line x1="850" y1="425" x2="850" y2="555" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><line x1="1065" y1="600" x2="975" y2="600" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="385.0" y="555.0" width="250" height="90" rx="12" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/><text x="510" y="596" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Save + update map</text><text x="510" y="614" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">+ &quot;N residents&quot; count</text><line x1="725" y1="600" x2="635" y2="600" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="45.0" y="555.0" width="250" height="90" rx="12" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/><text x="170" y="596" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Public accountability</text><text x="170" y="614" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">page (ward stats)</text><line x1="385" y1="600" x2="295" y2="600" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><line x1="510" y1="645" x2="510" y2="770" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><polygon points="510,770.0 635.0,830 510,890.0 385.0,830" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/><text x="510" y="826" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;" fill="#111827">Unresolved after</text><text x="510" y="844" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;" fill="#111827">N days?</text><rect x="725.0" y="785.0" width="250" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="850" y="826" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Escalation letter</text><text x="850" y="844" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">cites earlier IDs</text><line x1="635" y1="830" x2="725" y2="830" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="674.0" y="820.0" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;font-weight:700" fill="#b45309">YES</text><rect x="1065.0" y="785.0" width="250" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1190" y="826" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">RTI draft +</text><text x="1190" y="844" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">social post draft</text><line x1="975" y1="830" x2="1065" y2="830" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="45.0" y="785.0" width="250" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="170" y="835" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;" fill="#111827">Keep monitoring</text><line x1="385" y1="830" x2="295" y2="830" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="322.0" y="820.0" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;font-weight:700" fill="#b45309">NO</text><text x="40" y="935" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px" fill="#6b7280">Limit: complaints are drafted for filing, not submitted into government portals.</text></svg>