-family:'DejaVu Sans',Arial,sans-serif;font-size:14px" fill="#374151">unrepaired near the bus stop and school entrance for</text><text x="752" y="448" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px" fill="#374151">20 days. 47 residents have reported it. Please repair</text><text x="752" y="470" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px" fill="#374151">it urgently. Earlier complaint IDs: C-101, C-143.</text><rect x="752" y="520" width="110" height="42" rx="8" fill="#2563eb"/><text x="807.0" y="546" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;font-weight:700;" fill="#fff">Me too</text><rect x="880" y="520" width="110" height="42" rx="8" fill="#dc2626"/><text x="935.0" y="546" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;font-weight:700;" fill="#fff">Escalate</text><rect x="1020" y="520" width="130" height="42" rx="8" fill="#7c3aed"/><text x="1085.0" y="546" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:15px;font-weight:700;" fill="#fff">Draft RTI</text><rect x="752" y="590" width="448" height="110" rx="8" fill="#f3f4f6"/><text x="976" y="621" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;" fill="#374151">Ward 12 accountability</text><text x="976" y="639" text-anchor="middle" style="font-family:'DejaVu Sans',Arial,sans-serif;font-size:14px;" fill="#374151">Open: 18   Avg. resolution: 14 days (sample)</text></svg>